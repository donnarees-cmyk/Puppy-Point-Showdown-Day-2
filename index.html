<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Puppy Point Showdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
/* Layout: arcade game-show screens (join → read → question tiles → chest → podium) inside the navy Locksmith vault. Single committed look. */
:root{
  --vault:#13203f; --vault-2:#1d2d55; --gold:#f2b705; --gold-deep:#c98f00;
  --card:#fffaf0; --ink:#1b2240; --muted:#5b6283; --line:#e6dcc6;
  --t1:#e0245e; --t2:#1f6fe0; --t3:#d99a00; --t4:#1f9d6b;
  --good:#1f9d6b; --good-bg:#e3f6ec; --miss:#c2416b; --miss-bg:#fde7ee;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--vault);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;min-height:100%;
  background-image:radial-gradient(circle at 15% 10%,rgba(242,183,5,.12),transparent 40%),radial-gradient(circle at 85% 90%,rgba(90,140,255,.14),transparent 45%)}
.wrap{max-width:900px;margin:0 auto;padding-block:16px 50px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#fff;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo-spot{width:52px;height:52px;border-radius:12px;border:2px dashed rgba(242,183,5,.6);flex:none}
.brand small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.brand b{font-family:var(--display);font-weight:400;font-size:21px}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--vault-2);border:2px solid var(--gold);color:#fff;border-radius:999px;padding:5px 14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill span{color:var(--gold)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.12;text-wrap:balance}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.hero h1{font-size:clamp(34px,7vw,58px);color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{color:#dfe6ff;max-width:60ch;margin:6px 0 16px}
.btn{font:inherit;font-weight:700;font-size:19px;border:none;border-radius:14px;padding:12px 22px;cursor:pointer;background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-deep)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-deep)}
.btn.dark{background:var(--vault-2);color:#fff;box-shadow:0 5px 0 #0b1430}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 3px var(--line)}
.btn:focus-visible,.tile:focus-visible,.av:focus-visible,.chest:focus-visible{outline:4px solid #5a8cff;outline-offset:3px}
input[type=text]{font:inherit;font-size:20px;border:3px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--gold)}
.avs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.av{font:inherit;border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 4px;cursor:pointer;text-align:center;color:var(--ink)}
.av .e{font-size:40px;display:block;line-height:1.1}
.av small{font-size:13px;font-weight:700}
.av.sel{border-color:var(--gold);background:#fff6d6;transform:scale(1.04)}
.stds{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;font-size:13px}
.stds span{background:#eef3ff;border:1px solid #b9c8f0;border-radius:999px;padding:3px 10px;color:#1d3d8f}
.passage{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 20px}
.passage h2{font-size:30px;color:var(--ink);margin-bottom:6px}
.passage h3{font-size:22px;color:#2a7d72;margin:14px 0 4px}
.passage p{margin:0 0 10px;max-width:68ch}
.passage .pnum{color:var(--muted);font-weight:700;margin-right:4px}
.passage .cap{font-size:15px;color:var(--muted);font-style:italic;border-left:4px solid var(--line);padding-left:10px}
.passage .side{background:#fff6d6;border-left:6px solid var(--gold);border-radius:10px;padding:10px 14px;margin:10px 0}
.passage .tx{border-top:3px dashed var(--line);margin-top:16px;padding-top:12px}
.speak{font:inherit;font-size:15px;font-weight:700;border:2px solid var(--t2);background:#fff;color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;color:#fff}
.qhead .lbl{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--gold)}
.skill{display:inline-block;font-size:13px;font-weight:700;color:var(--muted);border:2px solid var(--line);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.qtext{font-size:clamp(20px,2.6vw,26px);font-weight:700;margin:0 0 6px}
.qpass{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;font-size:17px}
.timer{height:12px;background:var(--vault-2);border-radius:99px;overflow:hidden;margin:12px 0 4px;border:2px solid rgba(255,255,255,.15)}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd95a);width:100%}
.bonus{color:#dfe6ff;font-size:14px;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{font:inherit;font-size:19px;font-weight:700;color:#fff;border:none;border-radius:18px;padding:16px 16px;min-height:86px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .08s,opacity .2s}
.tile:active{transform:translateY(4px)}
.tile .sh{flex:none;width:34px;height:34px;display:grid;place-items:center;font-size:26px;line-height:1}
.tile.t0{background:var(--t1)}.tile.t1{background:var(--t2)}.tile.t2{background:var(--t3)}.tile.t3{background:var(--t4)}
.tile.dim{opacity:.3}
.tile.right{outline:6px solid #fff;box-shadow:0 0 0 10px var(--good)}
.tile[disabled]{cursor:default}
.result{margin-top:14px;border-radius:18px;padding:16px 18px}
.result.good{background:var(--good-bg);border:3px solid var(--good)}
.result.miss{background:var(--miss-bg);border:3px solid var(--miss)}
.result b.big{display:block;font-family:var(--display);font-weight:400;font-size:28px;margin-bottom:4px}
.chests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
.chest{font:inherit;border:none;background:var(--vault-2);color:#fff;border-radius:18px;padding:18px 6px;cursor:pointer;box-shadow:0 6px 0 #0b1430;text-align:center}
.chest .e{font-size:54px;display:block}
.chest.open{background:var(--gold);color:var(--ink);box-shadow:0 6px 0 var(--gold-deep)}
.chest.other{opacity:.45}
.board{display:grid;gap:8px;margin-top:12px}
.brow{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.brow.me{border-color:var(--gold);background:#fff6d6}
.brow .r{width:28px;color:var(--muted)}
.brow .e{font-size:26px}
.brow .n{flex:1;min-width:0}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px;margin:18px 0 8px;text-align:center}
.pod{border-radius:16px 16px 0 0;color:#fff;padding:10px 6px;font-weight:700;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.pod .e{font-size:44px}
.pod.p1{background:var(--gold);color:var(--ink);min-height:200px}.pod.p2{background:#8ea0c9;min-height:160px}.pod.p3{background:#c98f5a;min-height:130px}
.pod .place{font-family:var(--display);font-size:30px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:12px 0}
.stat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:30px}
.key{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:16px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-200%);opacity:0;background:var(--gold);color:var(--ink);font-family:var(--display);font-size:24px;padding:10px 22px;border-radius:999px;box-shadow:0 6px 0 var(--gold-deep);transition:transform .3s,opacity .3s;z-index:20;text-align:center;max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%);opacity:1}
footer{color:#aab4d6;font-size:13px;text-align:center;margin-top:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.logo-img{width:76px;height:76px;flex:none;border-radius:14px;background:#fff;object-fit:contain;box-shadow:0 3px 0 rgba(0,0,0,.25)}
</style>

const GAME={"key": "ll-hsa-game-day2-v1", "day": "Day 2", "gameName": "Puppy Point Showdown", "textWord": "article", "intro": "Read a science article about dogs and wolves, then battle the bots using text evidence, vocabulary, organizational patterns, and text features.", "bots": [["🐺", "Wolf Bot"], ["🦊", "Fox Bot"], ["🐱", "Cat Bot"]], "botSkill": [0.68, 0.58, 0.48], "std": ["ELA.K12.EE.1.1", "ELA.6.R.2.1", "ELA.6.V.1.3"], "passage": "<h2>Do Dogs Understand Pointing?</h2><p><span class=\"pnum\">1</span>Point at something and ask a toddler to look. The child's eyes follow your finger. It seems simple, but most animals can't do it. So why do so many dogs understand pointing?</p><h3>The Pointing Test</h3><p><span class=\"pnum\">2</span>In a common investigation, a researcher hides a treat under one of two cups. Then the researcher points to the correct cup. If the dog walks to that cup, it has followed the point. Many dogs pass this test on the very first try.</p><h3>Puppies vs. Wolf Pups</h3><p><span class=\"pnum\">3</span>Scientists wondered whether dogs learn this skill from living with people. To find out, researchers tested puppies as young as eight weeks old. Many puppies followed pointing, even though they had very little training. However, wolf pups raised by people usually did not follow pointing as well. Both animals are closely related, but only the dogs seemed ready to read human gestures.</p><h3>Why the Difference?</h3><p><span class=\"pnum\">4</span>Many scientists think the difference comes from history. For thousands of years, people kept dogs that worked well with humans. As a result, dogs that paid attention to people were more likely to be chosen and cared for. Over time, this skill became part of who dogs are.</p><div class=\"side\"><b>Try It at Home (Sidebar):</b> Hide a treat under one of two cups, point to the right one, and see whether your dog follows. Keep it fun and give lots of praise!</div><p class=\"cap\">Caption: A puppy chooses the cup that the researcher is pointing to.</p><p><span class=\"pnum\">5</span>Understanding pointing may seem like a small trick, but it shows something big. Dogs may be one of the few animals that are especially tuned in to people.</p>", "qs": [{"skill": "Text evidence", "q": "Which sentence BEST supports the idea that most animals cannot follow pointing?", "o": ["\"Point at something and ask a toddler to look.\"", "\"It seems simple, but most animals can't do it.\"", "\"Then the researcher points to the correct cup.\"", "\"Keep it fun and give lots of praise!\""], "a": 1, "why": "This sentence directly states that most animals can't follow pointing."}, {"skill": "Text evidence", "q": "Which evidence shows the skill does NOT come only from training?", "o": ["Dogs like treats.", "Puppies as young as eight weeks followed pointing with very little training.", "Researchers use two cups.", "Wolves are related to dogs."], "a": 1, "why": "Young puppies with little training still followed pointing, so it isn't only learned from training."}, {"skill": "RACE answer", "q": "Which answer uses text evidence correctly to answer: <i>How are dogs and wolf pups different?</i>", "o": ["Wolves are scary.", "Dogs and wolves are different. According to the text, many puppies followed pointing, but wolf pups raised by people usually did not. This shows dogs are more tuned in to human gestures.", "Dogs are better pets.", "I think wolves are smarter."], "a": 1, "why": "It restates, answers, cites evidence with 'According to the text,' and explains with 'This shows.'"}, {"skill": "Organizational pattern", "q": "Which organizational pattern does paragraph 3 mainly use?", "o": ["chronological", "compare and contrast", "problem and solution", "description"], "a": 1, "why": "It compares puppies and wolf pups and uses 'However' to show a difference."}, {"skill": "Organizational pattern", "q": "Paragraph 4 uses the words \"As a result.\" Which pattern does this signal?", "o": ["cause and effect", "compare and contrast", "question and answer", "chronological"], "a": 0, "why": "'As a result' shows an effect: people choosing helpful dogs caused dogs to pay attention to people."}, {"skill": "Organizational pattern", "q": "How does paragraph 1 organize its ideas?", "o": ["It asks a question to set up the article.", "It lists steps in order.", "It solves a problem.", "It describes wolves."], "a": 0, "why": "It ends with a question ('why do so many dogs understand pointing?') that the article answers: question and answer."}, {"skill": "Vocabulary: investigation", "q": "In paragraph 2, an <b>investigation</b> is…", "o": ["a game for dogs", "a careful study to find out facts", "a kind of treat", "a dog trainer"], "a": 1, "why": "An investigation is a careful study, like the pointing test."}, {"skill": "Context clues", "q": "In paragraph 3, <b>gestures</b> most likely means…", "o": ["movements of the hands or body that send a message", "loud noises", "kinds of food", "dog toys"], "a": 0, "why": "Pointing is a gesture, a movement that sends a message."}, {"skill": "Text features", "q": "What is the purpose of the <b>Try It at Home</b> sidebar?", "o": ["to state the central idea", "to give readers an extra activity related to the article", "to list the article's sources", "to define pointing"], "a": 1, "why": "The sidebar gives a bonus activity connected to the topic."}, {"skill": "Text features", "q": "How does the caption help the reader?", "o": ["It explains what the photo shows: a puppy choosing the pointed cup.", "It tells the article's conclusion.", "It gives the author's name.", "It lists wolf facts."], "a": 0, "why": "A caption explains a photo so readers can picture the test."}, {"skill": "Text features", "q": "Which heading would help you find the part about WHY dogs are different from wolves?", "o": ["The Pointing Test", "Puppies vs. Wolf Pups", "Why the Difference?", "Do Dogs Understand Pointing?"], "a": 2, "why": "The heading 'Why the Difference?' tells you that section explains the reason."}], "title": "How Smart Are Animals?", "bonusSecs": 25};
const STD={"ELA.6.R.2.1": "Structure", "ELA.6.R.2.2": "Central Idea", "ELA.6.R.2.3": "Purpose and Perspective", "ELA.6.R.3.2": "Paraphrasing", "ELA.6.V.1.1": "Academic Vocabulary", "ELA.6.V.1.3": "Context and Connotation", "ELA.K12.EE.1.1": "Cite Evidence", "ELA.6.C.3.1": "Conventions"};

const AVATARS=[["🐦‍⬛","Crow"],["🐙","Octopus"],["🐬","Dolphin"],["🐝","Bee"],["🦜","Parrot"],["🐘","Elephant"],["🐒","Chimp"],["🐕","Dog"]];
const SHAPES=["▲","◆","●","■"];
const PRAISE=["Brainy!","You're on fire!","Locksmith level up!","Genius move!","Nailed it!","Super reader!","Unstoppable!","Smarter than a crow!"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Math.round(n).toLocaleString("en-US");
const TEACH=location.hash==="#teacher";
window.addEventListener("hashchange",()=>location.reload());

/* ---------- state (autosaves on this iPad) ---------- */
const KEY=GAME.key;
let S=null;
function fresh(){ return {phase:"join",name:"",av:0,idx:0,score:0,streak:0,best:0,mult:1,ans:{},second:[],sidx:0,bots:GAME.bots.map(b=>({n:b[1],e:b[0],s:0})),chestDone:{}}; }
try{ S=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
if(!S) S=fresh();
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };

/* ---------- read aloud: Google US English ---------- */
let VOICE=null;
function pv(){ try{ const v=speechSynthesis.getVoices(); VOICE=v.find(x=>x.name==="Google US English")||v.find(x=>x.lang==="en-US"&&/Google/.test(x.name))||v.find(x=>x.lang==="en-US")||null; }catch(e){} }
if("speechSynthesis" in window){ pv(); speechSynthesis.onvoiceschanged=pv; }
function speak(text){ if(!("speechSynthesis" in window)) return; speechSynthesis.cancel(); const t=String(text).replace(/<[^>]+>/g," ").replace(/ELA\.[A-Z0-9.]+/g,"").replace(/[▲◆●■🔥🏆]/g,"").replace(/\s+/g," ").trim(); const u=new SpeechSynthesisUtterance(t); if(VOICE) u.voice=VOICE; u.lang="en-US"; u.rate=.95; speechSynthesis.speak(u); }
const hush=()=>{ try{ speechSynthesis.cancel(); }catch(e){} };

/* ---------- fx ---------- */
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1500); }
function pop(){ if(window.confetti) confetti({particleCount:80,spread:75,origin:{y:.7},colors:["#e0245e","#1f6fe0","#f2b705","#1f9d6b"]}); }
function big(){ if(!window.confetti) return; const end=Date.now()+2400; (function f(){ confetti({particleCount:7,angle:60,spread:60,origin:{x:0}}); confetti({particleCount:7,angle:120,spread:60,origin:{x:1}}); if(Date.now()<end) requestAnimationFrame(f); })(); confetti({particleCount:180,spread:120,origin:{y:.55}}); }

/* ---------- render ---------- */
const app=document.getElementById("app");
document.getElementById("gtitle").textContent=GAME.title+" · "+GAME.day;
function hud(){ const h=document.getElementById("hud"); h.hidden=!["question","chest","second"].includes(S.phase); document.getElementById("hScore").textContent=fmt(S.score); document.getElementById("hStreak").textContent=S.streak; }
function stdChips(){ return `<div class="stds">${GAME.std.map(c=>`<span>${c} · ${STD[c]}</span>`).join("")}</div>`; }
let timerH=null, tStart=0;
function stopTimer(){ clearInterval(timerH); timerH=null; }

function render(){
  hush(); stopTimer(); hud();
  if(TEACH) return renderKey();
  ({join:renderJoin,read:renderRead,question:renderQ,chest:renderChest,second:renderQ,podium:renderPodium})[S.phase]();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderJoin(){
  app.innerHTML=`<section class="hero"><h1>${GAME.gameName}</h1><p>${GAME.intro}</p></section>
  <div class="card"><h2 style="font-size:28px">Join the game</h2>
  <p style="margin:8px 0">Type your first name and pick your animal player.</p>
  <input type="text" id="nm" maxlength="24" placeholder="First name" aria-label="First name" value="${esc(S.name)}">
  <div class="avs">${AVATARS.map((a,i)=>`<button class="av ${S.av===i?"sel":""}" data-i="${i}"><span class="e">${a[0]}</span><small>${a[1]}</small></button>`).join("")}</div>
  <p style="font-size:16px;color:var(--muted)">How to play: Read the ${GAME.textWord}. Answer ${GAME.qs.length} questions. Faster answers earn bonus points, streaks earn more, and every right answer opens a mystery chest. Missed questions come back in the Second Chance round. Try to beat the bots!</p>
  <button class="btn" id="go">Let's play! ▶</button>${stdChips()}</div>`;
  app.querySelectorAll(".av").forEach(b=>b.onclick=()=>{ S.av=+b.dataset.i; app.querySelectorAll(".av").forEach(x=>x.classList.toggle("sel",x===b)); });
  document.getElementById("go").onclick=()=>{ const n=document.getElementById("nm").value.trim(); if(!n){ toast("Type your name first!"); return; } S.name=n; S.phase="read"; save(); pop(); render(); };
}

function passageHTML(){ return `<div class="passage" id="pass">${GAME.passage}</div>`; }
function renderRead(){
  app.innerHTML=`<div class="card"><div class="row" style="margin-bottom:10px"><h2 style="font-size:26px">📖 Step 1: Read the ${GAME.textWord}</h2><button class="speak" id="rd">🔊 Read to me</button></div>
  <p style="color:var(--muted);margin:0 0 10px">Read carefully. You can open the ${GAME.textWord} again during the game.</p>
  ${passageHTML()}<div style="margin-top:14px"><button class="btn" id="ready">I'm ready! Start the game ▶</button></div></div>`;
  document.getElementById("rd").onclick=()=>speak(document.getElementById("pass").innerHTML);
  document.getElementById("ready").onclick=()=>{ S.phase="question"; save(); render(); };
}

function curQ(){ return S.phase==="second"?GAME.qs[S.second[S.sidx]]:GAME.qs[S.idx]; }
function renderQ(){
  const sec=S.phase==="second", qi=sec?S.second[S.sidx]:S.idx, q=GAME.qs[qi];
  const label=sec?`Second Chance ${S.sidx+1} of ${S.second.length}`:`Question ${S.idx+1} of ${GAME.qs.length}`;
  app.innerHTML=`<div class="qhead"><span class="lbl">${label}${S.mult>1?" · ⚡ Double points!":""}</span><div class="row" style="gap:8px"><button class="speak" id="openP">📖 ${GAME.textWord}</button><button class="speak" id="rq">🔊 Read question</button></div></div>
  <div class="card"><span class="skill">${q.skill}</span><p class="qtext">${q.q}</p>${q.p?`<div class="qpass">${q.p}</div>`:""}
  <div id="pbox" hidden style="margin-top:10px">${passageHTML()}</div></div>
  ${sec?"":`<div class="timer"><i id="tbar"></i></div><div class="bonus" id="tlab">Speed bonus: +500</div>`}
  <div class="tiles">${q.o.map((o,k)=>`<button class="tile t${k}" data-k="${k}"><span class="sh">${SHAPES[k]}</span><span>${o}</span></button>`).join("")}</div><div id="res"></div>`;
  document.getElementById("rq").onclick=()=>speak(q.q+". "+(q.p||"")+". "+q.o.map((o,k)=>["A","B","C","D"][k]+". "+o).join(". "));
  document.getElementById("openP").onclick=()=>{ const b=document.getElementById("pbox"); b.hidden=!b.hidden; };
  if(!sec){ tStart=Date.now(); const bar=document.getElementById("tbar"), lab=document.getElementById("tlab");
    timerH=setInterval(()=>{ const left=Math.max(0,1-(Date.now()-tStart)/GAME.bonusSecs/1000); bar.style.width=(left*100)+"%"; lab.textContent=left>0?`Speed bonus: +${Math.round(left*500)}`:"No speed bonus now. Take your time!"; if(left<=0) stopTimer(); },200); }
  app.querySelectorAll(".tile").forEach(t=>t.onclick=()=>answer(qi,+t.dataset.k,sec));
}

function botsMove(){ S.bots.forEach((b,i)=>{ if(Math.random()<GAME.botSkill[i]) b.s+=1000+Math.random()*900; }); }
function answer(qi,k,sec){
  const q=GAME.qs[qi]; const right=k===q.a; stopTimer();
  const left=sec?0:Math.max(0,1-(Date.now()-tStart)/GAME.bonusSecs/1000);
  app.querySelectorAll(".tile").forEach(t=>{ const kk=+t.dataset.k; t.disabled=true; if(kk===q.a) t.classList.add("right"); else if(kk!==k) t.classList.add("dim"); else if(!right) t.classList.add("dim"); });
  let gain=0, msg="";
  if(right){
    if(sec){ gain=500; } else { S.streak++; S.best=Math.max(S.best,S.streak); gain=(1000+Math.round(left*500)+Math.min(S.streak-1,5)*100)*S.mult; S.mult=1; }
    S.score+=gain; msg=`<div class="result good"><b class="big">${pick(PRAISE)} +${fmt(gain)}</b>${!sec&&S.streak>1?`🔥 ${S.streak} in a row! `:""}${q.why}</div>`;
    pop();
  } else {
    if(!sec){ S.streak=0; S.mult=1; if(!S.second.includes(qi)) S.second.push(qi); }
    msg=`<div class="result miss"><b class="big">Not this time!</b>The answer is <b>${["▲","◆","●","■"][q.a]} ${q.o[q.a]}</b>. ${q.why}${sec?"":"<br><br>💪 This question will come back in the Second Chance round."}</div>`;
  }
  if(!sec){ S.ans[qi]={k,right}; botsMove(); } else { S.ans[qi].second=right; }
  save(); hud();
  const res=document.getElementById("res");
  res.innerHTML=msg+`<div style="margin-top:12px"><button class="btn" id="nx">${right&&!sec?"Open a mystery chest 🎁":"Next ▶"}</button></div>`;
  res.scrollIntoView({behavior:"smooth",block:"nearest"});
  document.getElementById("nx").onclick=()=>{
    if(right&&!sec){ S.phase="chest"; }
    else advance(sec);
    save(); render();
  };
}
function advance(sec){
  if(sec){ S.sidx++; if(S.sidx>=S.second.length){ S.phase="podium"; } return; }
  S.idx++;
  if(S.idx>=GAME.qs.length){ S.phase=S.second.length?"second":"podium"; S.sidx=0; if(S.second.length) setTimeout(()=>toast("Second Chance round!"),300); }
  else S.phase="question";
}

function renderChest(){
  const rows=board().slice(0,4);
  app.innerHTML=`<div class="card"><h2 style="font-size:30px">🎁 Pick a mystery chest!</h2><p style="margin:6px 0 0">One chest has a big prize.</p>
  <div class="chests">${[0,1,2].map(i=>`<button class="chest" data-i="${i}"><span class="e">🧰</span>Chest ${i+1}</button>`).join("")}</div><div id="cres"></div>
  <h3 style="margin-top:12px;font-size:22px">Leaderboard</h3><div class="board">${rows.map(boardRow).join("")}</div></div>`;
  const prizes=[["+300 points",()=>S.score+=300],["+500 points",()=>S.score+=500],["⚡ Double points on your next question!",()=>S.mult=2],["🔑 Lucky Key: +750 points",()=>S.score+=750],["+200 points",()=>S.score+=200]];
  app.querySelectorAll(".chest").forEach(c=>c.onclick=()=>{
    if(app.querySelector(".chest.open")) return;
    const pr=pick(prizes); pr[1](); c.classList.add("open"); c.querySelector(".e").textContent="✨";
    app.querySelectorAll(".chest").forEach(x=>{ if(x!==c){ x.classList.add("other"); x.disabled=true; } });
    pop(); toast(pr[0]); hud();
    document.getElementById("cres").innerHTML=`<p style="font-size:22px;font-weight:700;margin:8px 0">You got: ${pr[0]}</p><button class="btn" id="cn">Next question ▶</button>`;
    advance(false); save();
    document.getElementById("cn").onclick=()=>render();
  });
}

function board(){ const me={n:S.name,e:AVATARS[S.av][0],s:S.score,me:true}; return [me,...S.bots].sort((a,b)=>b.s-a.s); }
function boardRow(p,i){ return `<div class="brow ${p.me?"me":""}"><span class="r">${i+1}</span><span class="e">${p.e}</span><span class="n">${esc(p.n)}${p.me?" (you)":""}</span><span>${fmt(p.s)}</span></div>`; }

function renderPodium(){
  const b=board(), myPlace=b.findIndex(p=>p.me)+1;
  const first=GAME.qs.filter((q,i)=>S.ans[i]&&S.ans[i].right).length;
  const missed=GAME.qs.map((q,i)=>({q,i})).filter(o=>!(S.ans[o.i]&&S.ans[o.i].right));
  const skills=[...new Set(missed.map(o=>o.q.skill))];
  const top=[b[1],b[0],b[2]];
  app.innerHTML=`<div class="card" style="text-align:center"><h1 style="font-size:clamp(34px,6vw,52px);color:var(--gold-deep)">${myPlace===1?"🏆 You won!":myPlace<=3?"🎉 You made the podium!":"🎉 Game complete!"}</h1>
  <div class="podium">${top.map((p,i)=>p?`<div class="pod p${[2,1,3][i]}"><span class="e">${p.e}</span><span>${esc(p.n)}${p.me?" (you)":""}</span><span>${fmt(p.s)}</span><span class="place">${[2,1,3][i]}</span></div>`:"<div></div>").join("")}</div>
  <div class="stats" style="text-align:left"><div class="stat"><b>${fmt(S.score)}</b>points</div><div class="stat"><b>${first} / ${GAME.qs.length}</b>right on the first try</div><div class="stat"><b>${S.best}</b>best streak 🔥</div><div class="stat"><b>#${myPlace}</b>of ${b.length} players</div></div>
  <div style="text-align:left">${skills.length?`<p><b>Skills to keep practicing:</b> ${skills.join(", ")}</p>`:`<p><b>Perfect first-try game! Every skill unlocked. 🔑</b></p>`}
  <p style="color:var(--muted);font-size:16px">Tap <b>Copy my results</b> and paste them into Canvas.</p></div>
  <div class="row" style="justify-content:center"><button class="btn" id="cp">Copy my results</button><button class="btn ghost" id="again">Play again</button></div></div>`;
  if(!S.celebrated){ S.celebrated=true; save(); setTimeout(big,250); }
  document.getElementById("cp").onclick=()=>{ const txt=`${GAME.title} ${GAME.day} – ${GAME.gameName}\nName: ${S.name}\nScore: ${fmt(S.score)}\nFirst try: ${first}/${GAME.qs.length}\nBest streak: ${S.best}\nPlace: ${myPlace} of ${b.length}\nSkills to practice: ${skills.join(", ")||"none – perfect game!"}`;
    navigator.clipboard.writeText(txt).then(()=>toast("Copied! Paste it in Canvas.")).catch(()=>{ const ta=document.createElement("textarea"); ta.value=txt; ta.rows=7; ta.style.width="100%"; app.querySelector(".card").appendChild(ta); ta.select(); toast("Copy the box below."); }); };
  const ag=document.getElementById("again"); let armed=false;
  ag.onclick=()=>{ if(!armed){ armed=true; ag.textContent="Tap again to start over"; return; } const n=S.name, av=S.av; S=fresh(); S.name=n; S.av=av; S.phase="read"; save(); render(); };
}

function renderKey(){
  app.innerHTML=`<div class="card"><h2 style="font-size:30px">👩‍🏫 Teacher answer key: ${GAME.day}</h2>${stdChips()}
  <details style="margin:12px 0"><summary style="cursor:pointer;font-weight:700">Show the ${GAME.textWord}</summary>${passageHTML()}</details>
  ${GAME.qs.map((q,i)=>`<div class="key"><b>${i+1}. ${q.q}</b> <span class="skill">${q.skill}</span>${q.p?`<div class="qpass">${q.p}</div>`:""}<br>✅ <b>${q.o[q.a]}</b><br><span style="color:var(--muted)">${q.why}</span></div>`).join("")}</div>`;
}

render();
</script>

</body></html>
